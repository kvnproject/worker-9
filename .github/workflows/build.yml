name: Build APK Flutter
run-name: Build APK - ${{ inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        required: true
      userId:
        required: true
      payload:
        required: true
      build_type:
        required: false
        default: 'release'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Parse payload
        run: |
          echo '${{ github.event.inputs.payload }}' > payload.json
          MODE=$(jq -r '.mode // "zip"' payload.json)
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          RELEASE_TAG=$(jq -r '.releaseTag // empty' payload.json)
          FILE_NAME=$(jq -r '.fileName // empty' payload.json)
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          echo "FILE_NAME=$FILE_NAME" >> "$GITHUB_ENV"

      - name: Download & extract ZIP
        if: env.MODE == 'zip'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf project_raw project.zip
          mkdir -p project_raw
          gh release download "$RELEASE_TAG" --pattern "$FILE_NAME" --repo "${{ github.repository }}" --output project.zip
          unzip -q project.zip -d project_raw

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Detect Project
        id: detect
        run: |
          PUBSPEC=$(find project_raw -type f -name pubspec.yaml -not -path "*/build/*" | head -n 1)
          if [ -n "$PUBSPEC" ]; then
            DIR=$(dirname "$PUBSPEC")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Project tidak dikenali."
            exit 1
          fi

      - name: FIX KOTLIN VERSION
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          set -euo pipefail
          if [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version ".*"/org.jetbrains.kotlin.android" version "1.9.0"/' android/settings.gradle
          fi
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/org.jetbrains.kotlin.android" version ".*"/org.jetbrains.kotlin.android" version "1.9.0"/' android/settings.gradle.kts
          fi
          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/distributionUrl=.*/distributionUrl=https\\:\\/\\/services.gradle.org\\/distributions\\/gradle-8.6-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          fi
          echo "✅ Kotlin & Gradle berhasil di-upgrade!"

      - name: Build Flutter APK
        working-directory: ${{ steps.detect.outputs.dir }}
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build apk --release --target-platform=android-arm,android-arm64 --no-tree-shake-icons

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
          retention-days: 1